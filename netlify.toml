[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Set this to your Render backend URL in the Netlify dashboard
  # VITE_API_URL = "https://your-backend.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

